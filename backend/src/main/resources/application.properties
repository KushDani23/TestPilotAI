# =============================================================================
# TestPilot AI – Application Configuration
# =============================================================================
# This file contains all externalized configuration for the Spring Boot app.
# Values like API keys should NEVER be hardcoded in Java classes.
# They belong here so they can be changed without recompiling the code.
# =============================================================================

# ── Server Configuration ──────────────────────────────────────────────────────
# Port on which the Spring Boot server will run
server.port=8080

# ── Application Name ─────────────────────────────────────────────────────────
spring.application.name=testpilot-backend

# ── Groq API Configuration ───────────────────────────────────────────────────
# Groq provides ultra-fast LLM inference using an OpenAI-compatible API.
#
# How to get your Groq API key:
# 1. Go to: https://console.groq.com/keys
# 2. Sign in with your account
# 3. Click "Create API Key"
# 4. Copy the key and paste it below
#
groq.api.key=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

# Groq chat completions endpoint (OpenAI-compatible)
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Model to use — llama3-8b-8192 is fast, free-tier, and great for structured JSON
groq.model=llama-3.1-8b-instant

# ── Logging ───────────────────────────────────────────────────────────────────
# Show only WARN and ERROR logs to keep console output clean
# Change to DEBUG for more verbose output during development
logging.level.root=WARN
logging.level.com.testpilot=INFO
