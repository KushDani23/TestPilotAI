server.port=${PORT:8080}
spring.application.name=testpilot-backend

# Spring AI — OpenAI-compatible configuration (pointed at Groq)
# The API key is NOT stored here — it is supplied per-request via the X-Groq-Api-Key header.
# A placeholder is required so Spring AI auto-configuration does not fail on startup.
spring.ai.openai.api-key=placeholder
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=3500

# Logging Configuration
logging.level.root=WARN
logging.level.com.testpilot=INFO
